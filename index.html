        window._hmt = window._hmt || []
        window._hmt.push(['_setAutoPageview', false])
        const script = document.createElement('script')
        script.id = 'baidu-tongji-script'
        script.async = true
        script.src = scriptUrl
        script.onerror = () => { script.dataset.loadState = 'failed' }
